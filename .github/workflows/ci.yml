name: CI

on:
  push:
    branches: [main, codex/ci-tab-focus]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check script syntax and resource formats
        run: python3 script/check-portable.py

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: |
          log="$RUNNER_TEMP/eligo-swift-test.log"
          result=0
          swift test > "$log" 2>&1 || result=$?
          cat "$log"
          awk '/Test Suite .*NSWorkspaceOpenerIntegrationTests.* (passed|failed) at/ {print "::notice::" $0}
               /Executed [0-9]+ tests?, with/ {summary=$0}
               END {if (summary) print "::notice title=XCTest summary::" summary}' "$log"
          if [[ "$result" != 0 ]]; then
            awk '/: error:|unexpected signal code|[Ff]atal error/ && !seen[$0]++ && n++ < 8 {print "::error::" $0}
                 /^Test Case .* started\./ {last=$0}
                 END {if (last) print "::notice title=Last XCTest started::" last}' "$log"
          fi
          exit "$result"

      - name: Test local build and installation scripts
        run: python3 script/test-build-and-run.py

      - name: Build and smoke-test routing recovery CLI
        run: bash script/test-routing-recovery.sh

      - name: Verify foreground chooser focus with keyboard navigation off and on
        if: github.ref == 'refs/heads/codex/ci-tab-focus'
        run: |
          echo "::notice::macOS $(sw_vers -productVersion) / $(swift --version | head -1)"
          python3 .github/diagnostics/run-chooser-focus.py "$(swift build --show-bin-path)/EligoPackageTests.xctest" --hosted-both-modes

      - name: Recheck macOS 15 Settings and NSWorkspace cold launch
        if: github.ref == 'refs/heads/codex/ci-tab-focus' && matrix.os == 'macos-15'
        run: |
          set -o pipefail
          swift test --skip-build --filter 'SettingsWindowControllerRuleWorkflowTests|NSWorkspaceOpenerIntegrationTests/testColdLaunchForwardsCompleteOrderedArgumentsAndApplicationIdentity' 2>&1 | tee "$RUNNER_TEMP/settings-cold.log"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          log = (Path(os.environ["RUNNER_TEMP"]) / "settings-cold.log").read_text()
          if not re.search(r"testColdLaunchForwardsCompleteOrderedArgumentsAndApplicationIdentity\]' passed", log):
              raise SystemExit("NSWorkspace cold launch did not pass")
          if not re.search(r"Executed 13 tests, with 0 failures", log):
              raise SystemExit("Expected twelve Settings tests and the cold launch to pass without skips")
          print("::notice title=macOS 15 Settings and workspace::12 Settings tests and the real NSWorkspace cold launch passed")
          PY
