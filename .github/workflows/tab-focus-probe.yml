name: Tab focus diagnostic

on:
  push:
    branches: [codex/ci-tab-focus]

permissions:
  contents: read

jobs:
  macos-15-build:
    name: macOS 15 Swift build
    if: github.event.created
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build with the runner toolchain
        run: |
          swift --version
          echo "::notice::macOS $(sw_vers -productVersion) / $(swift --version | head -1)"
          swift build

  forward-tab:
    name: macOS 26 forward Tab
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compile the test bundle
        run: |
          echo "::notice::macOS $(sw_vers -productVersion) / $(swift --version | head -1)"
          if ! swift build --build-tests >"$RUNNER_TEMP/build-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/build-tests.log"
            awk '/error:/ && n++ < 4 {print "::error::" $0}' "$RUNNER_TEMP/build-tests.log"
            exit 1
          fi
      - name: Compare the same forward Tab test
        shell: python3 {0}
        run: |
          import os
          import subprocess

          method = "testTabToNormalRowHighlightsAndActivatesThatBrowser"
          test_id = f"Test Case '-[EligoTests.ChooserKeyboardFocusTests {method}]'"
          source = "Tests/EligoTests/ChooserKeyboardFocusTests.swift"

          def run_case(label, panel, accessory=False):
              env = dict(os.environ, ELIGO_TAB_PANEL=panel, ELIGO_TAB_ACCESSORY_HOST=str(int(accessory)))
              run = subprocess.run(
                  ["swift", "test", "--skip-build", "--filter", f"ChooserKeyboardFocusTests/{method}"],
                  env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              print(f"::group::{label}", flush=True)
              print(run.stdout, end="", flush=True)
              print("::endgroup::", flush=True)
              lines = run.stdout.splitlines()
              started = [line for line in lines if test_id + " started." in line]
              ended = [line for line in lines if test_id + " passed (" in line or test_id + " failed (" in line]
              traces = [line for line in lines if line.startswith("ELIGO_TAB ")]
              valid = (len(started) == len(ended) == 1
                       and len(traces) == 2
                       and traces[0].startswith("ELIGO_TAB before ")
                       and traces[1].startswith("ELIGO_TAB after "))
              errors = [line for line in lines if ": error:" in line and method in line]
              status = "passed" if valid and run.returncode == 0 else "failed"
              details = " | ".join(line.removeprefix("ELIGO_TAB ") for line in traces)
              level = "notice" if valid else "error"
              print(f"::{level} file={source},title={label}::{status}, exit={run.returncode}, "
                    f"started={len(started)}, finished={len(ended)}, assertionsFailed={len(errors)} | {details}", flush=True)
              if not valid:
                  raise SystemExit(2)
              return status, traces[-1]

          hidden, _ = run_case("Default - captured test panel", "capture")
          shown, trace = run_case("Default - production display", "production")
          accessory = "key=true" not in trace or "active=true" not in trace
          if accessory:
              shown, trace = run_case("Default - production display in accessory app", "production", True)

          if hidden == shown:
              # Vary only the disposable runner's keyboard navigation setting. Each test starts a fresh process.
              key = "AppleKeyboardUIMode"
              original = subprocess.run(["defaults", "read", "-g", key], capture_output=True, text=True)
              initial = int(original.stdout.strip()) if original.returncode == 0 else 0
              mode = initial & ~2 if "fullAccess=true" in trace else initial | 2
              try:
                  subprocess.run(["defaults", "write", "-g", key, "-int", str(mode)], check=True)
                  run_case(f"Keyboard mode {mode} - captured test panel", "capture")
                  run_case(f"Keyboard mode {mode} - production display", "production", accessory)
              finally:
                  restore = ["write", "-g", key, "-int", str(initial)] if original.returncode == 0 else ["delete", "-g", key]
                  subprocess.run(["defaults", *restore], check=True)

          raise SystemExit(int(hidden != "passed" or shown != "passed"))
