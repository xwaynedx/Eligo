name: macOS diagnostics

on:
  push:
    branches: [codex/ci-tab-focus]

permissions:
  contents: read

jobs:
  settings-workflow:
    name: macOS 15 settings and workspace tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run SettingsWindowControllerRuleWorkflowTests
        run: |
          echo "::notice::macOS $(sw_vers -productVersion) / $(swift --version | head -1)"
          log="$RUNNER_TEMP/settings-workflow-tests.log"
          if ! swift test --filter SettingsWindowControllerRuleWorkflowTests > "$log" 2>&1; then
            cat "$log"
            awk '/: error:/ && !seen[$0]++ && n++ < 8 {print "::error::" $0}' "$log"
            exit 1
          fi
          cat "$log"
          summary=$(awk '/Executed [1-9][0-9]* tests?, with 0 failures/ {print; exit}' "$log")
          if [[ -z "$summary" ]]; then
            echo "::error::No passing settings workflow tests were reported"
            exit 1
          fi
          echo "::notice title=SettingsWindowControllerRuleWorkflowTests::$summary"

      - name: Trace the NSWorkspace cold launch
        shell: python3 {0}
        run: |
          import json
          from pathlib import Path
          import re
          import subprocess
          import time

          method = "testColdLaunchForwardsCompleteOrderedArgumentsAndApplicationIdentity"
          case = f"NSWorkspaceOpenerIntegrationTests/{method}"
          started = time.time()
          run = subprocess.run(["swift", "test", "--skip-build", "--filter", case],
                               stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(run.stdout, flush=True)
          if run.returncode == 0 and any(method in s and "]' passed (" in s for s in run.stdout.splitlines()):
              print("::notice::NSWorkspace cold launch passed (one XCTest case)")
              raise SystemExit(0)
          for line in run.stdout.splitlines():
              if "unexpected signal" in line or ": error:" in line:
                  print(f"::error::{line}", flush=True)
          if "unexpected signal" not in run.stdout:
              raise SystemExit(1)

          def output(*args):
              return subprocess.check_output(args, text=True).strip()

          xctest = output("xcrun", "--find", "xctest")
          bundle = Path(output("swift", "build", "--show-bin-path")) / "EligoPackageTests.xctest"
          try:
              debug = subprocess.run(
                  ["xcrun", "lldb", "--no-lldbinit", "--batch", "-o", "run", "-k", "thread backtrace -c 24",
                   "--", xctest, "-XCTest", f"EligoTests.{case}", str(bundle)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=105,
              )
              print(debug.stdout, flush=True)
              frames = [s.strip() for s in debug.stdout.splitlines()
                        if re.search(r"frame #\d+:|stop reason =|^error:", s)]
              if frames:
                  print("::notice title=LLDB cold launch::" + "%0A".join(frames[:28]), flush=True)
          except subprocess.TimeoutExpired:
              print("::notice::LLDB timed out; reading the system crash report", flush=True)

          locations = [Path.home() / "Library/Logs/DiagnosticReports", Path("/Library/Logs/DiagnosticReports")]
          reports = sorted((p for folder in locations for p in folder.glob("xctest*.ips")
                            if p.stat().st_mtime >= started - 1), key=lambda p: p.stat().st_mtime)
          for path in reports[:2]:
              data = path.read_text()
              header, end = json.JSONDecoder().raw_decode(data.lstrip())
              report = header if "threads" in header else json.loads(data.lstrip()[end:])
              thread = next((t for t in report["threads"] if t.get("triggered")), None)
              if thread is None:
                  thread = report["threads"][report["faultingThread"]]
              names = []
              for frame in thread["frames"][:24]:
                  image = report["usedImages"][frame["imageIndex"]]
                  symbol = frame.get("symbol")
                  if image.get("path") and "EligoPackageTests" in image["path"]:
                      base = image["base"]
                      resolved = subprocess.run(["xcrun", "atos", "-o", image["path"], "-l", hex(base),
                                                 hex(base + frame["imageOffset"])], capture_output=True, text=True)
                      symbol = resolved.stdout.strip() or symbol
                  names.append(f"{image.get('name', '?')}: {symbol or frame['imageOffset']}")
              print("::notice title=XCTest crash report::" + "%0A".join(
                  [str(report.get("exception")), "queue=" + str(thread.get("queue"))] + names), flush=True)
          raise SystemExit(1)

  forward-tab:
    name: macOS 26 forward Tab
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compile the test bundle
        run: |
          echo "::notice::macOS $(sw_vers -productVersion) / $(swift --version | head -1)"
          if ! swift build --build-tests >"$RUNNER_TEMP/build-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/build-tests.log"
            awk '/error:/ && n++ < 4 {print "::error::" $0}' "$RUNNER_TEMP/build-tests.log"
            exit 1
          fi
      - name: Run the forward Tab case in an AppKit application
        shell: python3 {0}
        run: |
          import os
          from pathlib import Path
          import plistlib
          import subprocess

          def output(*args):
              return subprocess.check_output(args, text=True).strip()

          tmp = Path(os.environ["RUNNER_TEMP"])
          developer = Path(output("xcrun", "--show-sdk-platform-path")) / "Developer"
          frameworks = developer / "Library/Frameworks"
          binary = tmp / "TabTestHost"
          subprocess.run([
              "xcrun", "clang", "-fobjc-arc", ".github/diagnostics/TabTestHost.m",
              "-F", str(frameworks), "-framework", "AppKit", "-framework", "XCTest",
              *[f"-Wl,-rpath,{p}" for p in (frameworks, developer / "Library/PrivateFrameworks", developer / "usr/lib")],
              "-o", str(binary),
          ], check=True)
          bundle = Path(output("swift", "build", "--show-bin-path")) / "EligoPackageTests.xctest"

          def make_app(policy):
              app = tmp / f"TabHost-{policy}.app"
              contents = app / "Contents"
              (contents / "MacOS").mkdir(parents=True)
              (contents / "MacOS/TabTestHost").write_bytes(binary.read_bytes())
              (contents / "MacOS/TabTestHost").chmod(0o755)
              (contents / "Info.plist").write_bytes(plistlib.dumps(dict(
                  CFBundleExecutable="TabTestHost", CFBundleIdentifier=f"io.github.xwaynedx.eligo.tabtest.{policy}",
                  CFBundleName="Tab Test Host", CFBundlePackageType="APPL", CFBundleVersion="1",
                  LSUIElement=(policy == "accessory"),
              )))
              subprocess.run(["codesign", "--force", "--sign", "-", str(app)], check=True)
              return app

          def run_case(app, setting):
              label = f"{app.stem} - {setting}"
              stdout = tmp / f"{label}.out"
              stderr = tmp / f"{label}.err"
              stdout.touch()
              stderr.touch()
              launched = subprocess.run([
                  "open", "-n", "-W", "--stdout", str(stdout), "--stderr", str(stderr),
                  "--env", "ELIGO_TAB_PANEL=production", "--env", f"ELIGO_TAB_TEST_BUNDLE={bundle}",
                  "-a", str(app),
              ], timeout=60)
              lines = (stdout.read_text() + "\n" + stderr.read_text()).splitlines()
              print(f"::group::{label}", *lines, "::endgroup::", sep="\n", flush=True)
              traces = [line for line in lines if line.startswith("ELIGO_TAB ")]
              result = [line for line in lines if line.startswith("ELIGO_HOST_TEST ")]
              assertions = list(dict.fromkeys(line for line in lines if line.startswith("ELIGO_HOST_ASSERT ")))
              if launched.returncode or len(traces) != 2 or len(result) != 1 or "executed=1 skipped=0" not in result[0]:
                  detail = " | ".join(lines[-5:]) or f"open returned {launched.returncode}"
                  print(f"::error title={label}::Missing test outcome: {detail}", flush=True)
                  raise SystemExit(2)
              message = " | ".join(result + traces + assertions[:2])
              print(f"::notice file=Tests/EligoTests/ChooserKeyboardFocusTests.swift,title={label}::{message}", flush=True)
              return "passed=true" in result[0], traces[-1]

          app = make_app("accessory")
          default_passed, trace = run_case(app, "runner default")
          if "key=true" not in trace or "active=true" not in trace:
              app = make_app("regular")
              default_passed, trace = run_case(app, "runner default")
          pref = "AppleKeyboardUIMode"
          read = subprocess.run(["defaults", "read", "-g", pref], capture_output=True, text=True)
          original = int(read.stdout) if read.returncode == 0 else 0
          mode = original & ~2 if "fullAccess=true" in trace else original | 2
          try:
              subprocess.run(["defaults", "write", "-g", pref, "-int", str(mode)], check=True)
              changed_passed, changed_trace = run_case(app, f"keyboard mode {mode}")
          finally:
              restore = ["write", "-g", pref, "-int", str(original)] if read.returncode == 0 else ["delete", "-g", pref]
              subprocess.run(["defaults", *restore], check=True)
          active = all("key=true" in entry and "active=true" in entry for entry in [trace, changed_trace])
          raise SystemExit(int(not (default_passed and changed_passed and active)))
